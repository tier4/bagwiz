# pixi manifest for bagwiz.
#
# bagwiz is a single-package ament_cmake / colcon C++ workspace (package.xml is
# at the repo root). This manifest lets anyone build, test, and run bagwiz with
# NO system ROS 2 install: the ROS toolchain and message packages come from
# RoboStack conda channels (one per ROS 2 distro), and the C/C++ toolchain comes
# from conda-forge. Pick a distro per invocation, e.g.:
#
#   pixi run -e humble build       # build against ROS 2 Humble (the default env)
#   pixi run -e jazzy test         # build + test against Jazzy
#   pixi run -e lyrical run -- --help
#   pixi shell -e jazzy            # interactive shell with `bagwiz` on PATH
#
# To layer your own message packages on top of any distro, point BAGWIZ_OVERLAY
# at one or more (colon-separated) external colcon workspaces before running:
#
#   BAGWIZ_OVERLAY=/path/to/my_msgs_ws pixi run -e jazzy run -- ls my.mcap
#
# See scripts/pixi-activate.sh for how the overlay is sourced.

[workspace]
name = "bagwiz"
version = "0.1.0"
# conda-forge supplies the C/C++ toolchain and the few non-ROS libraries
# (GeographicLib, SQLite, nlohmann_json). Each distro feature adds its own
# higher-priority robostack-<distro> channel so the ROS packages come from
# RoboStack and win ties over conda-forge.
channels = ["conda-forge"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# Default feature: distro-agnostic build toolchain + non-ROS libraries. It is
# included in every environment below, so each distro env inherits it.
# ---------------------------------------------------------------------------
[dependencies]
cmake = ">=3.27,<4"            # ament_cmake breaks under CMake 4; keep it pinned <4
ninja = "*"
make = "*"
c-compiler = "*"              # conda-forge gcc; sets CC on activation
cxx-compiler = "*"            # conda-forge g++; sets CXX on activation
pkg-config = "*"
colcon-common-extensions = "*"
git = "*"                     # CMake FetchContent (CLI11/fmt/rang) clones at configure time
nodejs = "*"                  # npm + tsc: compiles the map viewer's TypeScript at build time (BAGWIZ_WITH_MAP_VIEWER)
geographiclib-cpp = "*"       # GeographicLib C++ library (conda-forge); NOT the python `geographiclib`
nlohmann_json = "*"
sqlite = "*"
# ffmpeg (conda-forge) supplies the libav* libraries (libavcodec/libavformat/
# libavutil/libswscale) and their pkg-config files used by `generate video`
# (src/core/video/video_encoder.cpp). The conda-forge build bundles the libx264
# (H.264) and mjpeg encoders. Inherited by every distro environment.
ffmpeg = "*"
# opencv (conda-forge) backs the `bagwiz generate video --undistort` path: it
# reads sensor_msgs/msg/CameraInfo intrinsics and applies cv::undistort to each
# decoded frame before encoding. Linked PRIVATE so it does not leak into
# bagwiz_core's export set, matching GeographicLib and libav.
opencv = "*"
# libsixel (conda-forge) supplies libsixel + its pkg-config file (`libsixel.pc`)
# for the Sixel backend of `bagwiz walk`'s image preview
# (src/core/tui/image/terminal_image_renderer.cpp). Linked PRIVATE behind the
# renderer .cpp so it never enters bagwiz_core's export set, matching libav.
libsixel = "*"
# libboost-devel (conda-forge) supplies Boost for the GLIM SLAM stack built by
# `pixi run build-glim`. System Boost is unusable here: conda's gcc excludes
# /usr/include, so Boost must come from the env. Consumed only by the opt-in
# SLAM build (`build-slam`), but cheap enough to keep in the shared base.
libboost-devel = "*"

# Activation applies to every environment: select Cyclone DDS (bagwiz depends on
# rmw_cyclonedds_cpp; Fast DDS is the distro default since Jazzy) and source the
# built workspace + any external overlay.
[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"

[target.unix.activation]
scripts = ["scripts/pixi-activate.sh"]

# ---------------------------------------------------------------------------
# Tasks (shared by all distro environments; run with `-e <distro>`).
# ---------------------------------------------------------------------------
# Each distro builds into its OWN base (build/<distro>, install/<distro>) keyed on
# $PIXI_ENVIRONMENT_NAME, so switching `-e <distro>` never reuses another distro's
# colcon/CMake cache (which would silently link the wrong ROS libraries). The
# trailing symlink keeps a stable build/compile_commands.json pointing at the
# last-built distro for editor tooling and manual analysis.
[tasks.build]
args = [{ arg = "build_type", default = "Release" }]
cmd = 'colcon build --symlink-install --packages-up-to bagwiz --build-base "build/$PIXI_ENVIRONMENT_NAME" --install-base "install/$PIXI_ENVIRONMENT_NAME" --cmake-args -DCMAKE_BUILD_TYPE={{ build_type }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && ln -sfn "$PIXI_ENVIRONMENT_NAME/compile_commands.json" build/compile_commands.json'
inputs = ["src", "include", "test", "assets", "CMakeLists.txt", "package.xml"]

# Build the GLIM SLAM dependency stack (GTSAM + gtsam_points + glim) once into
# install/<distro>/glim-deps. Needed only for the SLAM build.
#
# Intentionally NOT pixi-cached (no `inputs`/`outputs`): the script is already
# idempotent via its own stamp at install/<distro>/glim-deps/.glim-deps.stamp, so
# re-running is a sub-second no-op when the prefix is present. A pixi `inputs`
# cache keyed on the script alone would report a false "cache hit" and skip the
# script even when the prefix is missing (e.g. after `pixi run clean` wipes
# install/, which leaves pixi's task cache in .pixi/ untouched), leaving the SLAM
# build to fail at `find_package(glim)`.
[tasks.build-glim]
cmd = 'bash scripts/build-glim-deps.sh'

# Build bagwiz with the opt-in `bagwiz map slam` command. Ensures the GLIM prefix
# exists, then turns on BAGWIZ_WITH_SLAM and points CMake at the prefix.
[tasks.build-slam]
depends-on = ["build-glim"]
cmd = 'colcon build --symlink-install --packages-up-to bagwiz --build-base "build/$PIXI_ENVIRONMENT_NAME" --install-base "install/$PIXI_ENVIRONMENT_NAME" --cmake-args -DCMAKE_BUILD_TYPE=Release -DBAGWIZ_WITH_SLAM=ON "-DCMAKE_PREFIX_PATH=$PIXI_PROJECT_ROOT/install/$PIXI_ENVIRONMENT_NAME/glim-deps" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && ln -sfn "$PIXI_ENVIRONMENT_NAME/compile_commands.json" build/compile_commands.json'

# Build the GPU GLIM stack (gtsam_points + glim with CUDA, sm_86) into
# install/<env>/glim-deps-cuda, reusing this env's CPU-prefix GTSAM (`build-glim`
# runs first via depends-on). Run in a *-gpu environment (e.g. `pixi run -e
# humble-gpu build-glim-gpu`) so the conda CUDA toolkit is on PATH; CUDA comes from
# $CONDA_PREFIX (nvcc + cudart + cusolver), no system /usr/local/cuda needed.
[tasks.build-glim-gpu]
depends-on = ["build-glim"]
cmd = 'bash scripts/build-glim-deps.sh --cuda'

# Build bagwiz with the GPU `bagwiz map slam --backend gpu` fast path
# (BAGWIZ_WITH_SLAM_CUDA=ON). Run in a *-gpu environment: the env name (e.g.
# humble-gpu) IS the build/install base, so the GPU build is fully isolated from
# the CPU environments (humble/jazzy) — their CMake caches never collide. CUDA is
# pixi-managed from $CONDA_PREFIX (conda-forge cuda-toolkit) + the conda g++ host
# compiler ($CXX, gcc 14.3) + single-arch sm_86. humble-gpu + jazzy-gpu (lyrical
# is SLAM-blocked).
[tasks.build-slam-gpu]
depends-on = ["build-glim-gpu"]
cmd = 'colcon build --symlink-install --packages-up-to bagwiz --build-base "build/$PIXI_ENVIRONMENT_NAME" --install-base "install/$PIXI_ENVIRONMENT_NAME" --cmake-args -DCMAKE_BUILD_TYPE=Release -DBAGWIZ_WITH_SLAM_CUDA=ON "-DCMAKE_PREFIX_PATH=$PIXI_PROJECT_ROOT/install/$PIXI_ENVIRONMENT_NAME/glim-deps-cuda;$PIXI_PROJECT_ROOT/install/$PIXI_ENVIRONMENT_NAME/glim-deps" -DCMAKE_CUDA_COMPILER=$CONDA_PREFIX/bin/nvcc "-DCMAKE_CUDA_HOST_COMPILER=$CXX" -DCMAKE_CUDA_ARCHITECTURES=86 -DCUDAToolkit_ROOT=$CONDA_PREFIX -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && ln -sfn "$PIXI_ENVIRONMENT_NAME/compile_commands.json" build/compile_commands.json'

# Run the GPU build's tests (incl. the GPU-gated cloud_mapper_gpu_test, which
# self-skips when no CUDA device is present). Run in a *-gpu environment.
[tasks.test-gpu]
depends-on = ["build-slam-gpu"]
cmd = 'colcon test --packages-select bagwiz --build-base "build/$PIXI_ENVIRONMENT_NAME" --install-base "install/$PIXI_ENVIRONMENT_NAME" --event-handlers console_direct+ && colcon test-result --test-result-base "build/$PIXI_ENVIRONMENT_NAME" --verbose'

[tasks.test]
cmd = 'colcon test --packages-select bagwiz --build-base "build/$PIXI_ENVIRONMENT_NAME" --install-base "install/$PIXI_ENVIRONMENT_NAME" --event-handlers console_direct+ && colcon test-result --test-result-base "build/$PIXI_ENVIRONMENT_NAME" --verbose'
depends-on = ["build"]

# Run the freshly built binary by explicit (per-distro) path: RoboStack activation
# already put $CONDA_PREFIX/lib on the loader path and $CONDA_PREFIX on
# AMENT_PREFIX_PATH, so the dynamic links, the runtime dlopen of introspection
# typesupport, and the .msg lookup all resolve. Pass arguments after `--`,
# e.g. `pixi run -e jazzy run -- ls x.mcap`.
[tasks.run]
cmd = 'install/$PIXI_ENVIRONMENT_NAME/bagwiz/bin/bagwiz'
depends-on = ["build"]

# Run the GPU build's binary so `map slam --backend gpu|auto` can select the CUDA
# backend (`--backend cpu` still runs on CPU). Run in a *-gpu environment, e.g.
# `pixi run -e humble-gpu run-gpu -- map slam …`.
[tasks.run-gpu]
cmd = 'install/$PIXI_ENVIRONMENT_NAME/bagwiz/bin/bagwiz'
depends-on = ["build-slam-gpu"]

# Install, in one step, a `bagwiz` launcher on PATH (default ~/.local/bin) AND
# tab completion for your current shell. Both are ALWAYS overwritten if they
# already exist, so re-running after a rebuild just refreshes them. The launcher
# targets this env's build (install/$PIXI_ENVIRONMENT_NAME); set BAGWIZ_INSTALL_DIR
# or BAGWIZ_DISTRO to override the destination or targeted distro. See
# scripts/bagwiz-install.sh for the details.
[tasks.install]
cmd = 'bash scripts/bagwiz-install.sh'
depends-on = ["build"]

# Install an on-PATH `bagwiz` launcher targeting the GPU build, so `bagwiz map slam
# --backend gpu|auto|cpu` switches the backend at runtime. Run in a *-gpu
# environment (e.g. `pixi run -e humble-gpu install-gpu`): the launcher targets and
# activates that env (install/<env>). Overwrites any existing launcher (re-run
# `pixi run install` from a CPU env to point it back at the CPU build).
[tasks.install-gpu]
cmd = 'bash scripts/bagwiz-install.sh'
depends-on = ["build-slam-gpu"]

[tasks.clean]
cmd = "rm -rf build install log"

# ---------------------------------------------------------------------------
# One feature per ROS 2 distro. Each adds its own robostack channel (higher
# priority than conda-forge) and the ros-<distro>-* packages bagwiz needs.
# The package set mirrors the find_package() calls in CMakeLists.txt plus the
# runtime rmw, the test message packages, and the per-distro zstd provider.
# ---------------------------------------------------------------------------
[feature.humble]
channels = [{ channel = "https://prefix.dev/robostack-humble", priority = 1 }]
[feature.humble.dependencies]
ros-humble-ros-base = "*"
ros-humble-ament-cmake = "*"
ros-humble-ament-index-cpp = "*"
ros-humble-rcutils = "*"
ros-humble-rmw = "*"
ros-humble-rmw-implementation = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
ros-humble-rosidl-runtime-c = "*"
ros-humble-rosidl-runtime-cpp = "*"
ros-humble-rosidl-typesupport-introspection-cpp = "*"
ros-humble-geometry-msgs = "*"
ros-humble-nav-msgs = "*"
ros-humble-std-msgs = "*"
ros-humble-tf2 = "*"
ros-humble-tf2-msgs = "*"
ros-humble-mcap-vendor = "*"
ros-humble-yaml-cpp-vendor = "*"
ros-humble-zstd-vendor = "*"
ros-humble-ament-cmake-gtest = "*"
ros-humble-sensor-msgs = "*"
ros-humble-diagnostic-msgs = "*"
ros-humble-builtin-interfaces = "*"

[feature.jazzy]
channels = [{ channel = "https://prefix.dev/robostack-jazzy", priority = 1 }]
[feature.jazzy.dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-index-cpp = "*"
ros-jazzy-rcutils = "*"
ros-jazzy-rmw = "*"
ros-jazzy-rmw-implementation = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-rosidl-runtime-c = "*"
ros-jazzy-rosidl-runtime-cpp = "*"
ros-jazzy-rosidl-typesupport-introspection-cpp = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-tf2 = "*"
ros-jazzy-tf2-msgs = "*"
ros-jazzy-mcap-vendor = "*"
ros-jazzy-yaml-cpp-vendor = "*"
ros-jazzy-zstd-vendor = "*"
ros-jazzy-ament-cmake-gtest = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-diagnostic-msgs = "*"
ros-jazzy-builtin-interfaces = "*"
# Jazzy's default Eigen (5.0.x) breaks the GLIM/GTSAM source build (cascading
# -Werror / missing-include); pin to 3.4 so `build-glim` works and bagwiz's SLAM
# translation units share one Eigen with the vendored prefix. Humble already
# ships 3.4, so it needs no pin.
eigen = "3.4.*"

[feature.lyrical]
channels = [{ channel = "https://prefix.dev/robostack-lyrical", priority = 1 }]
[feature.lyrical.dependencies]
ros-lyrical-ros-base = "*"
ros-lyrical-ament-cmake = "*"
ros-lyrical-ament-index-cpp = "*"
ros-lyrical-rcutils = "*"
ros-lyrical-rmw = "*"
ros-lyrical-rmw-implementation = "*"
ros-lyrical-rmw-cyclonedds-cpp = "*"
ros-lyrical-rosidl-runtime-c = "*"
ros-lyrical-rosidl-runtime-cpp = "*"
ros-lyrical-rosidl-typesupport-introspection-cpp = "*"
ros-lyrical-geometry-msgs = "*"
ros-lyrical-nav-msgs = "*"
ros-lyrical-std-msgs = "*"
ros-lyrical-tf2 = "*"
ros-lyrical-tf2-msgs = "*"
ros-lyrical-mcap-vendor = "*"
ros-lyrical-yaml-cpp-vendor = "*"
ros-lyrical-zstd-cmake-module = "*"   # Lyrical replaced zstd_vendor with zstd_cmake_module
zstd = "*"                            # the cmake module finds conda-forge libzstd
ros-lyrical-ament-cmake-gtest = "*"
ros-lyrical-sensor-msgs = "*"
ros-lyrical-diagnostic-msgs = "*"
ros-lyrical-builtin-interfaces = "*"
# NOTE: SLAM is not wired for lyrical. Unlike jazzy, lyrical cannot pin Eigen to
# 3.4 — ros-lyrical-tf2-eigen-kdl hard-requires eigen-abi 5.0.1, so `eigen=3.4`
# is unsatisfiable here. SLAM on lyrical would need a vendored Eigen 3.4 fed only
# to the GLIM build + bagwiz's SLAM units (the Milestone-0 approach); deferred.
# `build-slam` is supported on humble + jazzy.

# ---------------------------------------------------------------------------
# Optional GPU feature: the conda-forge CUDA toolkit (nvcc, cudart, cccl/thrust,
# cusolver/cublas — gtsam_points' GPU code uses cusolver) so the GPU SLAM build
# is fully pixi-managed (no system /usr/local/cuda). Combined with a distro
# feature into a *-gpu environment; CPU environments stay CUDA-free and lean.
# system-requirements.cuda declares the host driver supports CUDA 12.x so the
# conda CUDA runtime packages solve.
# ---------------------------------------------------------------------------
[feature.gpu.dependencies]
cuda-toolkit = "12.8.*"
cuda-version = "12.8.*"

[feature.gpu.system-requirements]
cuda = "12"

# ---------------------------------------------------------------------------
# One environment per distro. Each solves independently against its own
# robostack channel (no shared solve-group). `default` aliases humble so a bare
# `pixi run build` targets Humble. The *-gpu environments add the conda CUDA
# toolkit for the GPU SLAM build (humble + jazzy; lyrical stays SLAM-blocked).
# ---------------------------------------------------------------------------
[environments]
default = ["humble"]
humble = ["humble"]
jazzy = ["jazzy"]
lyrical = ["lyrical"]
humble-gpu = ["humble", "gpu"]
jazzy-gpu = ["jazzy", "gpu"]

[pypi-dependencies]
numpy = "*"
matplotlib = ">=3.11.0, <4"
