name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  colcon:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.distro }}-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/bagwiz

      - name: Install pinned dependencies via setup.sh
        shell: bash
        run: |
          # Build and test against the versions pinned in deps/<distro>.lock,
          # the same ones shipped to users, so CI exercises the real install
          # path. apt-get update populates the cache setup.sh's pinned
          # `apt-get install name=version` reads; rosdep update keeps the
          # fallback path working if a lock is ever missing.
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          ./src/bagwiz/setup.sh

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: colcon test
        shell: bash
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Install cppcheck and pre-commit (jazzy)
        if: matrix.distro == 'jazzy'
        shell: bash
        run: |
          apt-get install -y --no-install-recommends cppcheck python3-pip git
          pip install --break-system-packages pre-commit

      - name: Run cppcheck and clang-tidy via pre-commit (jazzy)
        if: matrix.distro == 'jazzy'
        shell: bash
        working-directory: src/bagwiz
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src/bagwiz"
          # The pre-commit hook expects build/compile_commands.json relative to
          # the repo root. colcon places it at the workspace root, so expose it
          # under the package's expected path via a symlink.
          ln -s "$GITHUB_WORKSPACE/build" build
          pre-commit run cppcheck --all-files --show-diff-on-failure
          pre-commit run clang-tidy --all-files --show-diff-on-failure
