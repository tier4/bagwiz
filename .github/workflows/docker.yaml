name: docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tier4/bagwiz

jobs:
  build:
    # Build each architecture on a native runner so the C++/ROS compile does
    # not run under slow QEMU emulation. Each job pushes an untagged image
    # addressed only by digest; the merge job assembles the tags.
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Delegate the image build to build.sh so CI and a local "build.sh
      # --docker" build bagwiz the exact same way. --push-by-digest switches
      # build.sh to a buildx push-by-digest build and --metadata-file captures
      # the pushed digest for the merge job. --native is deliberately never
      # passed: these images run on other people's CPUs.
      - name: Build and push by digest
        run: |
          ./build.sh --docker \
            --distro "${{ matrix.distro }}" \
            --platform "linux/${{ matrix.arch }}" \
            --push-by-digest "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --metadata-file "${{ runner.temp }}/metadata.json"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="$(jq -r '."containerimage.digest"' "${{ runner.temp }}/metadata.json")"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.distro }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.distro }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # One image per distro. "latest" tracks jazzy only. Version tags are
          # emitted on v* tag pushes, suffixed per distro plus an unsuffixed
          # version for jazzy.
          tags: |
            type=raw,value=${{ matrix.distro }}
            type=raw,value=latest,enable=${{ matrix.distro == 'jazzy' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.distro }}
            type=semver,pattern={{version}},enable=${{ matrix.distro == 'jazzy' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.distro }}"
